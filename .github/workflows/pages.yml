# Bei jedem Push auf main: prüfen (Typen, Tests, Balancing-Simulation), bauen und auf GitHub Pages veröffentlichen.
# Schlägt eine Prüfung fehl, wird nichts veröffentlicht – die alte Version bleibt online.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Typprüfung
        run: bunx -p typescript@5 tsc --noEmit -p .
      - name: Tests
        run: bun test
      - name: Balancing-Simulation
        run: bun scripts/simulate.ts
      - name: Release bauen
        run: bun scripts/build.ts --release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
