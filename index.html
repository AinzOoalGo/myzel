<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14110e" />
    <title>Myzel</title>
    <style>
      :root {
        --bg: #14110e;
        --panel: #1d1914;
        --line: #342d25;
        --ink: #f0e6d6;
        --quiet: #a99d8b;
        --accent: #ffd68c;
        --accent-ink: #2a1f0e;
        --warn: #e58b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; }
      [hidden] { display: none !important; }

      /* Kopfzeile: oben die Ressourcen (teilen sich die Breite), darunter der Zonen-Fortschritt als Balken */
      header { padding: calc(6px + env(safe-area-inset-top)) 8px 6px; border-bottom: 1px solid var(--line); }
      #res-row { display: flex; align-items: center; gap: 2px; justify-content: space-between; }
      /* Breite nach Inhalt: kleine Werte (Wasser 100) brauchen wenig Platz, große Zahlen bekommen mehr */
      .res { flex: 0 0 auto; display: flex; flex-direction: column; line-height: 1.12; padding: 1px 5px;
        border-left: 1px solid var(--line); }
      .res:first-child { border-left: 0; padding-left: 2px; }
      .res .l { font-size: clamp(9px, 2.6vw, 11px); color: var(--quiet); white-space: nowrap; }
      .res .v { font-weight: 700; font-size: clamp(11.5px, 3.45vw, 17px); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .res .r { font-size: clamp(9px, 2.6vw, 11px); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .res .r.neg { color: var(--warn); }
      #btn-settings { flex: none; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 10px;
        width: 36px; height: 36px; font-size: 17px; cursor: pointer; margin-left: auto; }
      #progress-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
      #net { font-size: 11px; color: var(--quiet); white-space: nowrap; font-variant-numeric: tabular-nums; }
      #net-bar { flex: 1; height: 4px; background: #2b251d; border-radius: 2px; overflow: hidden; }
      #net-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .4s ease; }
      #speed-badge { background: #6b2a2a; color: #ffd9d0; font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
      .speed-row { display: flex; gap: 6px; }
      .slider { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
      .slider span { width: 70px; }
      .slider input { flex: 1; accent-color: var(--accent); height: 28px; }
      .up.pulse { animation: rowpulse .5s ease; }
      @keyframes rowpulse { 0% { background: rgba(255,214,140,.18); } 100% { background: transparent; } }
      @media (prefers-reduced-motion: reduce) { .up.pulse { animation: none; } }
      .box .speed-row button { margin-top: 0; background: #2b251d; color: var(--ink); border: 1px solid var(--line); }
      .box .speed-row button.on { background: var(--accent); color: var(--accent-ink); }
      @media (max-width: 360px) {
        .res { padding: 1px 3px; }
        #res-row { gap: 0; }
        #btn-settings { width: 32px; height: 32px; font-size: 15px; }
        #card .grow { padding: 6px 12px; font-size: 13px; }
        #card .grow .lbl { display: none; }
        #tabs .count { display: none; }
        #tabs button { font-size: 12px; }
        .buy { min-width: 84px; }
      }

      main { position: relative; flex: 1; min-height: 200px; }
      canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: pointer; }
      #hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: max-content; max-width: 90%;
        background: rgba(29,25,20,.9); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px;
        font-size: 13px; color: var(--ink); pointer-events: none; text-align: center; }

      #season { position: absolute; left: 10px; bottom: 10px; background: rgba(29,25,20,.85); border: 1px solid var(--line);
        border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--quiet); pointer-events: none; }
      #view-btns { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
      #view-btns button { background: rgba(29,25,20,.9); color: var(--ink);
        border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
      #sheet { background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column;
        padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
      #panel { height: 36vh; min-height: 200px; overflow-y: auto; margin: 0 -12px 6px; padding: 4px 12px 0;
        border-bottom: 1px solid var(--line); }
      #tabs { display: flex; gap: 6px; margin: 0; }
      #tabs button::after { content: '▴'; margin-left: 6px; font-size: 10px; opacity: .6; }
      #tabs button.on::after { content: '▾'; }
      #tabs button { flex: 1; background: none; border: 1px solid var(--line); color: var(--quiet); border-radius: 10px;
        padding: 8px 6px; font-size: 13px; font-weight: 600; cursor: pointer; position: relative; min-height: 38px; }
      #tabs button.on { background: #2b251d; color: var(--ink); border-color: var(--accent); }
      #tabs .badge { position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      #tabs .count { color: var(--quiet); font-weight: 400; font-size: 11px; }
      .prestige { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 4px 0 8px; background: #221d16; }
      .prestige p { margin: 4px 0 8px; }
      .buy.wide { width: 100%; }
      .buy.owned { background: #2b3a26; color: #bfe3b1; }
      .spores-line { font-size: 13px; color: var(--accent); margin: 6px 0; }
      h3.branch { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--quiet); margin: 14px 0 2px; }
      .ach { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); opacity: .5; }
      .ach.done { opacity: 1; }
      .stats { border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; margin: 6px 0; }
      .stats-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
      .stats-row:last-child { border-bottom: 0; }
      .stats-row span { color: var(--quiet); }
      .text-in { flex: 1; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
      .quest-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 2px; }
      .quest .up-name { font-size: 13.5px; }
      .quest.claimed { opacity: .55; }
      .qbar { height: 5px; background: #2b251d; border-radius: 3px; margin: 4px 0 2px; overflow: hidden; }
      .qbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
      .ach-mark { width: 22px; text-align: center; color: var(--accent); font-weight: 700; }
      #toast { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); background: #2b251d; color: var(--ink);
        border: 1px solid var(--accent); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600;
        pointer-events: none; white-space: nowrap; z-index: 3; }
      #toast.show { animation: toast 2.6s ease both; }
      @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #toast.show { animation: none; } }
      .small { font-size: 12px; color: var(--quiet); }

      /* Knoten-Karte: eine schmale Zeile über den Knöpfen – Name links, Kosten rechts */
      #card { border: 1px solid var(--accent); border-radius: 12px; padding: 6px 6px 6px 10px; margin: 0 0 6px;
        background: #241f18; display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; min-height: 54px; }
      .card-head { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
      .card-head strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      .card-head .x { background: none; border: 0; color: var(--quiet); font-size: 18px; cursor: pointer; line-height: 1;
        padding: 0 4px; min-height: 0; order: -1; margin-right: 2px; }
      /* Infos unter der Zeile: was bringt der Knoten, und kurz was er ist */
      .card-yield { font-size: 12.5px; color: var(--accent); margin: 3px 0 0 28px; flex-basis: 100%; order: 3; }
      .card-desc { font-size: 11.5px; color: var(--quiet); margin: 1px 0 0 28px; flex-basis: 100%; order: 4; line-height: 1.3; }
      #card .grow { order: 2; width: auto; min-height: 40px; padding: 6px 14px; font-size: 14px;
        border-radius: 999px; white-space: nowrap; }
      .card-why { font-size: 11.5px; color: var(--warn); margin: 2px 0 0 28px; flex-basis: 100%; order: 5; }
      .card-why:empty { display: none; }

      .up { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
      .up:last-child { border-bottom: 0; }
      .up-text { flex: 1; min-width: 0; }
      .up-name { font-weight: 600; font-size: 14px; }
      .up-name small { color: var(--quiet); font-weight: 400; margin-left: 4px; white-space: nowrap; }
      .up-desc { font-size: 11.5px; color: var(--quiet); }
      #locked { font-size: 12px; color: var(--quiet); margin: 8px 0 0; }

      button { font: inherit; }
      .buy, .grow, .box button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
        padding: 10px 12px; font-weight: 700; min-height: 44px; cursor: pointer; font-variant-numeric: tabular-nums; }
      .buy { min-width: 96px; min-height: 40px; padding: 6px 12px; font-size: 13px; border-radius: 999px; white-space: nowrap; }
      .buy.wide { white-space: normal; }
      .grow { width: 100%; }
      button:disabled { background: #3a332a; color: #857a6b; cursor: default; }
      button:not(:disabled):active { transform: scale(.97); }

      #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
      .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: 100%; max-width: 440px;
        max-height: 88vh; overflow-y: auto; -webkit-user-select: text; user-select: text; }
      .box h2 { margin: 0 0 8px; font-size: 20px; }
      .box h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--quiet); }
      .box p { margin: 0 0 10px; }
      .box button { width: 100%; margin-top: 8px; }
      .box button.danger { background: #4a2a22; color: #ffcfbf; }
      .box textarea { width: 100%; height: 64px; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px; font: 11px/1.3 ui-monospace, monospace; }
      .box hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0 8px; }
      .small { font-size: 12px; color: var(--quiet); }
      .center { text-align: center; margin-top: 12px !important; }
      .warn { color: var(--warn); font-size: 13px; }
      .warn:empty { display: none; }
      .toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
      .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
      .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
      .legend-item { display: inline-flex; align-items: center; gap: 6px; }
      .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
      .legend i.hex { border-radius: 2px; transform: rotate(45deg) scale(.85); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div id="res-row">
          <div class="res" id="res-n"><span class="l"></span><span class="v">0</span><span class="r"></span></div>
          <div class="res" id="res-sugar" hidden><span class="l"></span><span class="v">0</span><span class="r"></span></div>
          <div class="res" id="res-water" hidden><span class="l"></span><span class="v">0</span><span class="r"></span></div>
          <div class="res" id="res-min" hidden><span class="l"></span><span class="v">0</span><span class="r"></span></div>
          <div class="res" id="res-spores" hidden><span class="l"></span><span class="v">0</span><span class="r"></span></div>
          <button id="btn-settings" aria-label="Einstellungen">⚙</button>
        </div>
        <div id="progress-row">
          <span id="net"></span>
          <div id="net-bar" role="progressbar" aria-label="Fortschritt der Zone"><i></i></div>
          <span id="speed-badge" hidden></span>
        </div>
      </header>
      <main>
        <canvas id="cv" tabindex="0" role="application"></canvas>
        <div id="hint" hidden role="status" aria-live="polite"></div>
        <div id="season" hidden></div>
        <div id="view-btns">
          <button id="btn-origin">⌂ Ursprung</button>
          <button id="btn-center" hidden>⌖ Zentrieren</button>
        </div>
        <div id="toast" hidden role="status" aria-live="polite"></div>
      </main>
      <section id="sheet">
        <!-- aufklappbare Liste: nur sichtbar, wenn ein Knopf unten aktiv ist -->
        <div id="panel" hidden>
          <div id="tab-grow">
            <div id="upgrades"></div>
            <p id="locked"></p>
          </div>
          <div id="tab-genome" hidden></div>
          <div id="tab-ach" hidden></div>
        </div>
        <div id="card" hidden></div>
        <nav id="tabs">
          <button data-tab="grow" aria-expanded="false"><span class="label"></span><i class="badge" hidden></i></button>
          <button data-tab="genome" aria-expanded="false"><span class="label"></span><i class="badge" hidden></i></button>
          <button data-tab="ach" aria-expanded="false"><span class="label"></span> <small class="count"></small><i class="badge" hidden></i></button>
        </nav>
      </section>
    </div>
    <div id="modal" hidden><div class="box"></div></div>
    <!--APP_SCRIPT-->
  </body>
</html>
